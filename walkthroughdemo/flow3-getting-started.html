<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ImpactLens Flow 3: Getting started</title>
<style>
:root{--bg:#0f1720;--fg:#f4f6f8;--muted:#9aa7b4;--accent:#3b82f6;--ok:#22c55e;--warn:#f59e0b;--ai:#7c3aed;--card:rgba(10,16,24,.9);--panel:#f8fafc;--ink:#0f172a;--line:#cbd5e1}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#eef2f6;--fg:#111827;--muted:#4b5563;--accent:#1d4ed8;--card:rgba(255,255,255,.96)}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:10px 16px 0;flex-wrap:wrap}
header h1{font-size:15px;margin:0;font-weight:700;flex:1;min-width:180px}
.lv{display:flex;border:1px solid rgba(127,127,127,.4);border-radius:999px;overflow:hidden}
.lv button:focus-visible{outline-offset:-3px}.lv button{border:0;border-radius:0;padding:6px 12px;min-height:34px;font-size:13px;background:transparent}
.lv button[aria-pressed=true]{background:var(--accent);color:#fff;font-weight:700}
#clock{font-size:13px;color:var(--muted);min-width:76px;text-align:right}
.bar{height:4px;background:rgba(127,127,127,.25);border-radius:4px;margin:8px 16px 0;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--accent)}
#stage{flex:1;min-height:0;display:flex;justify-content:center;padding:10px 16px 6px}
.frame{width:min(100%,1200px);height:100%;display:flex;flex-direction:column;gap:8px;min-height:0}
/* maps */
.maps{flex:none;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.macro{display:flex;align-items:center;gap:2px}
.grp{flex:1;min-width:0;border-radius:10px;padding:4px 6px 6px;border:1px solid var(--line)}
.grp.u1{background:#eff6ff;border-color:#bfdbfe}.grp.u2{background:#ecfdf5;border-color:#a7f3d0}
.gl{font-size:10.5px;font-weight:800;letter-spacing:.06em;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u1 .gl{color:#1d4ed8}.u2 .gl{color:#047857}
.sts{display:flex;align-items:center;gap:0}
.st{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:5px;padding:5px 7px;border-radius:9px;background:#fff;border:2px solid var(--line);font-size:12px;line-height:1.15;color:#64748b;transition:background .35s,border-color .35s,color .35s}
.st i{flex:none;width:19px;height:19px;border-radius:50%;background:#e2e8f0;color:#334155;font:700 11px/19px system-ui;text-align:center;font-style:normal}
.st b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st.done{border-color:#86efac;color:#14532d;background:#f0fdf4}.st.done i{background:var(--ok);color:#fff;font-size:0}.st.done i:before{content:"\2713";font-size:12px}
.st.cur{border-color:#2563eb;color:#1e3a8a;background:#dbeafe;font-weight:700;animation:flash 1s ease-in-out infinite}
.st.cur i{background:#2563eb;color:#fff;animation:blinkb 1s ease-in-out infinite}
@keyframes flash{0%,100%{box-shadow:0 0 0 0 rgba(37,99,235,.65);background:#dbeafe}50%{box-shadow:0 0 0 7px rgba(37,99,235,0);background:#eff6ff}}
@keyframes blinkb{50%{transform:scale(1.25)}}
.ar{flex:none;position:relative;width:16px;height:2px;background:#cbd5e1;margin:0 1px;transition:background .3s}
.ar:after{content:"";position:absolute;right:-1px;top:-4px;border:5px solid transparent;border-left:7px solid #cbd5e1;border-right:0;transition:border-color .3s}
.ar.done{background:var(--ok)}.ar.done:after{border-left-color:var(--ok)}
.ar.live{background:repeating-linear-gradient(90deg,#2563eb 0 4px,transparent 4px 8px);background-size:8px 2px;animation:dash .5s linear infinite}
.ar.live:after{border-left-color:#2563eb}
@keyframes dash{to{background-position:8px 0}}
.ar.big{width:22px}
.hand{flex:none;width:86px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;text-align:center;font-weight:700;color:#92400e;background:#fffbeb;border:2px dashed #f59e0b;border-radius:14px;line-height:1.15;padding:3px;align-self:center;transition:all .3s}
.hand big{font-size:20px;line-height:1}
.hand.on{background:#fde68a;border-style:solid;animation:flashw 1s ease-in-out infinite}
@keyframes flashw{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,.7)}50%{box-shadow:0 0 0 8px rgba(245,158,11,0)}}
.micro{display:flex;align-items:center;gap:0;margin-top:6px;overflow-x:auto;scrollbar-width:none;padding:3px 2px}
.micro::-webkit-scrollbar{display:none}
.mt{flex:none;font-size:10.5px;font-weight:800;letter-spacing:.06em;color:#64748b;margin-right:8px}
.mc{flex:none;display:flex;align-items:center;gap:5px;font-size:12px;padding:3px 10px;border-radius:999px;border:2px solid var(--line);background:#fff;color:#64748b;transition:all .3s;white-space:nowrap}
.mc.done{border-color:#86efac;background:#f0fdf4;color:#14532d}.mc.done:before{content:"\2713";color:var(--ok);font-weight:800}
.mc.cur{border-color:#2563eb;color:#1e3a8a;font-weight:700;background:#dbeafe;animation:flash 1s ease-in-out infinite}
.mc.cur:before{content:"";width:7px;height:7px;border-radius:50%;background:#2563eb;animation:blinkb 1s infinite}
.micro .ar{width:12px}
/* view */
.view{position:relative;flex:1;min-height:0;border-radius:12px;overflow:hidden;background:#0b1118;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.scene{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .5s}
.scene.on{opacity:1}
.shot{display:flex;gap:10px;padding:10px}
.imgcol{position:relative;flex:1;min-width:0;border-radius:8px;background:#e5e7eb;overflow:hidden}
.fit{position:absolute;left:0;top:0;transform-origin:0 0;transition:transform 1.4s cubic-bezier(.4,0,.2,1)}
.fit img{display:block;width:100%;height:100%}
.cb{position:absolute;border:3px solid #f97316;border-radius:6px;box-shadow:0 0 0 2px rgba(255,255,255,.85),0 0 0 0 rgba(239,68,68,0);opacity:0;transform:scale(1.06);transition:all .4s}
.cb.on{opacity:1;transform:none}.cb.cur{border-color:#ef4444;animation:cbp 1.4s infinite}
@keyframes cbp{50%{box-shadow:0 0 0 2px rgba(255,255,255,.9),0 0 14px 4px rgba(239,68,68,.55)}}
.cb u{position:absolute;left:-12px;top:-12px;width:24px;height:24px;border-radius:50%;background:#ef4444;color:#fff;font:700 13px/24px system-ui;text-align:center;text-decoration:none;transform:scale(var(--inv,1));transform-origin:50% 50%}
.legend{flex:none;width:270px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.lg{background:var(--card);border-radius:10px;padding:8px 10px;color:var(--fg);opacity:0;transform:translateX(10px);transition:all .4s;display:flex;gap:8px;align-items:flex-start;border-left:4px solid #ef4444}
.lg.on{opacity:1;transform:none}
.lg u{flex:none;width:22px;height:22px;border-radius:50%;background:#ef4444;color:#fff;font:700 12px/22px system-ui;text-align:center;text-decoration:none}
.lg b{display:block;font-size:13.5px;margin-bottom:1px}.lg span{font-size:12.5px;line-height:1.35;color:var(--muted)}
.svgs{background:var(--panel);display:flex;align-items:center;justify-content:center;padding:6px}
.svgs svg{width:100%;height:100%;max-height:100%}
.svgs text{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.title{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:linear-gradient(135deg,#0f172a,#1e3a8a 60%,#4c1d95);color:#fff}
.title h2{font-size:clamp(24px,4.4vw,44px);margin:6px 0 10px;line-height:1.15}
.title p{max-width:720px;margin:0;line-height:1.55;font-size:clamp(14px,2vw,18px);color:#dbeafe}
.title .tag{font-size:12px;letter-spacing:.14em;font-weight:800;color:#93c5fd}
.title .pills{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.title .pills span{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);padding:6px 12px;border-radius:999px;font-size:13px}
.chip{position:absolute;top:10px;left:10px;z-index:5;background:var(--accent);color:#fff;font-weight:700;font-size:12.5px;padding:5px 10px;border-radius:999px;opacity:0;transform:translateY(-6px);transition:all .4s}
.chip.on{opacity:1;transform:none}
.caption{flex:none;background:var(--card);border-radius:12px;padding:10px 14px;box-shadow:0 6px 24px rgba(0,0,0,.25);min-height:62px}
.caption b{display:block;font-size:16px;margin-bottom:2px}.caption span{font-size:14px;line-height:1.45;color:var(--muted)}
.controls{display:flex;gap:8px;align-items:center;justify-content:center;padding:4px 16px 12px;flex-wrap:wrap}
button{font:inherit;border:1px solid rgba(127,127,127,.35);background:transparent;color:var(--fg);padding:8px 14px;border-radius:8px;cursor:pointer;min-height:40px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:focus-visible{outline:3px solid var(--ok);outline-offset:2px}
#count{color:var(--muted);font-size:13px;min-width:70px;text-align:center}
/* svg animation helpers */
.pop{animation:pop .55s ease both;transform-box:fill-box;transform-origin:center}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.95)}to{opacity:1;transform:none}}
.fade{animation:fade .6s ease both}@keyframes fade{from{opacity:0}to{opacity:1}}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .8s ease both}
@keyframes draw{from{stroke-dashoffset:1;opacity:0}12%{opacity:1}to{stroke-dashoffset:0;opacity:1}}
.pk{animation:mv var(--t,1s) linear var(--d,0s) both}
@keyframes mv{0%{opacity:0;transform:translate(0,0)}8%{opacity:1}92%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy))}}
.lit{animation:lit 1s ease var(--d,0s) both;transform-box:fill-box;transform-origin:center}
@keyframes lit{0%{filter:none}40%{filter:drop-shadow(0 0 7px #16a34a) brightness(1.05)}100%{filter:none}}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.4s ease var(--d,0s) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.blink{animation:blink 1.1s infinite}@keyframes blink{50%{opacity:.35}}
@media (max-width:760px){
  .legend{display:none}
  .macro .gl{display:none}.st b{display:none}.st{justify-content:center;padding:4px}.hand{width:40px}.hand small{display:none}.ar{width:8px}.ar.big{width:10px}
  .shot{padding:6px}
  .svgs{overflow-x:auto;justify-content:flex-start}.svgs svg{min-width:720px;width:720px;height:auto;max-height:none}
  #clock{display:none}
  .caption b{font-size:15px}.caption span{font-size:13px}
}
@media (prefers-reduced-motion: reduce){
  .st.cur,.mc.cur,.hand.on,.ar.live,.st.cur i,.mc.cur:before{animation:none!important}.fit{transition:none}.pop,.fade,.draw,.pk,.lit,.grow,.blink,.cb.cur,.mc.cur:before{animation:none!important}
  .draw{stroke-dashoffset:0}.pk{opacity:0}
}

.grp.u3{background:#fff7ed;border-color:#fed7aa}.u3 .gl{color:#c2410c}
.grp.u4{background:#f5f3ff;border-color:#ddd6fe}.u4 .gl{color:#6d28d9}
.or{flex:none;font-size:10px;font-weight:800;color:#64748b;padding:0 6px;letter-spacing:.06em}
.home{font-size:12.5px;color:var(--muted);text-decoration:none;border:1px solid rgba(127,127,127,.4);padding:6px 10px;border-radius:999px;min-height:34px;display:inline-flex;align-items:center}
.home:hover{color:var(--fg)}
a.btnlink{font:inherit;border:1px solid var(--accent);background:var(--accent);color:#fff;padding:8px 14px;border-radius:8px;min-height:40px;display:inline-flex;align-items:center;text-decoration:none;font-weight:700}
a.btnlink[hidden]{display:none}
a:focus-visible{outline:3px solid var(--ok);outline-offset:2px}
.cost{font-weight:800}
.blur{filter:blur(0)}

</style>
</head>

<header>
  <a class="home" href="index.html">&#9664; All walkthroughs</a>
  <h1>Flow 3 · Getting started: sign in and pick a role</h1>
  <div class="lv" role="group" aria-label="Walkthrough length">
    <button id="lv1" aria-pressed="true">Level 1 · 1 min</button>
    <button id="lv2" aria-pressed="false">Level 2 · 3 min</button>

<div class="bar" aria-hidden="true"><i id="prog"></i></div>
<div id="stage"><div class="frame">

  <div class="view" id="view" role="region" aria-label="Walkthrough" aria-live="off">
    <div class="chip" id="chip"></div>
  </div>
  <div class="caption" id="caption" aria-live="polite"><b></b><span></span></div>
</div></div>
<div class="controls">
  <button id="prev" aria-label="Previous scene">&#9664; Back</button>
  <button id="play" class="primary" aria-label="Pause">Pause</button>
  <button id="next" aria-label="Next scene">Next &#9654;</button>
  <span id="count"></span>
  <a id="nextflow" class="btnlink" href="index.html" hidden>Next</a>
</div>

      lg+='<div class="lg" data-i="'+j+'"><u>'+(j+1)+'</u><div><b>'+c.n+'</b><span>'+(c.x||'')+'</span></div></div>';
    });
    el.innerHTML='<div class="imgcol"><div class="fit"><img alt="" src="'+im.f+'">'+cb+'</div></div><div class="legend">'+lg+'</div>';
  }
  view.insertBefore(el,chip);nodes[i]=el;return el;
}
function fit(el,s){
  if(s.k!=='shot')return;
  var col=el.querySelector('.imgcol'),f=el.querySelector('.fit'),im=IMGS[s.img];
  var cw=col.clientWidth,ch=col.clientHeight,ar=im.w/im.h,w=Math.min(cw,ch*ar),h=w/ar;
  f.style.width=w+'px';f.style.height=h+'px';f.style.left=((cw-w)/2)+'px';f.style.top=((ch-h)/2)+'px';
  f._g={cw:cw,ch:ch,w:w,h:h,l:(cw-w)/2,t:(ch-h)/2};
}
function zoom(el,s,on){
  var f=el.querySelector('.fit');if(!f||!f._g)return;
  var g=f._g,im=IMGS[s.img];
  if(!on||!s.z||reduce){f.style.transform='none';f.style.setProperty('--inv',1);return;}
  var rx=(s.z[0]-im.ox)/im.w*g.w,ry=(s.z[1]-im.oy)/im.h*g.h,rw=s.z[2]/im.w*g.w,rh=s.z[3]/im.h*g.h;
  var sc=Math.min(g.cw/rw,g.ch/rh,1.7);if(sc<1.2){f.style.transform='none';f.style.setProperty('--inv',1);return;}
  var tx_=g.cw/2-g.l-(rx+rw/2)*sc,ty_=g.ch/2-g.t-(ry+rh/2)*sc;
  f.style.setProperty('--inv',(1/sc).toFixed(3));
  f.style.transform='translate('+tx_.toFixed(1)+'px,'+ty_.toFixed(1)+'px) scale('+sc.toFixed(3)+')';
}
function show(i){
  if(i<0)i=0;if(i>=list.length)i=list.length-1;
  if(cur>=0&&nodes[cur])nodes[cur].classList.remove('on');
  if(cur>=0&&list[cur]&&list[cur].k==='svg'&&nodes[cur]){nodes[cur].parentNode.removeChild(nodes[cur]);delete nodes[cur];}
  cur=i;t=0;ended=false;nextEl.hidden=true;
  var s=list[i],el=mk(i);
  el._z=0;fit(el,s);zoom(el,s,false);
  void el.offsetWidth;el.classList.add('on');
  chip.textContent=s.chip||'';chip.className='chip'+(s.chip&&s.k!=='title'?' on':'');
  cap.querySelector('b').textContent=s.t;cap.querySelector('span').textContent=level===1&&s.x1?s.x1:s.x;
  setMaps(s.st,s.mi);lastMi=s.st+':'+s.mi;
  document.getElementById('count').textContent=(i+1)+' / '+list.length;
  if(list[i+1]&&list[i+1].k==='shot')mk(i+1);
}
function tick(now){
  var dt=(now-last)/1000;last=now;
  if(playing&&cur>=0&&!ended){t+=dt;}
  if(cur>=0){
    var s=list[cur],d=dur(s),f=Math.min(1,t/d);
    if(s.k==='shot'&&s.cs){
      var el=nodes[cur],n=s.cs.length,rev=-1,mi=s.mi;
      for(var j=0;j<n;j++){if(f>=0.1+0.6*j/n){rev=j;if(s.cs[j].m!=null)mi=s.cs[j].m;}}
      var cbs=el.querySelectorAll('.cb'),lgs=el.querySelectorAll('.lg');
      for(var j2=0;j2<n;j2++){
        cbs[j2].classList.toggle('on',j2<=rev);cbs[j2].classList.toggle('cur',j2===rev);
        lgs[j2].classList.toggle('on',j2<=rev&&(window.innerWidth>760||j2===rev));
      }
      if(s.z&&f>0.04&&!el._z){el._z=1;zoom(el,s,true);}
      if(s.z&&f<0.04&&el._z){el._z=0;zoom(el,s,false);}
      if(cap&&rev>=0&&window.innerWidth<=760){cap.querySelector('span').textContent=s.cs[rev].n+': '+(s.cs[rev].x||'');}
      setMicroOnce(s.st,mi);
    }else if(s.mis){
      var mm=s.mi;for(var q=0;q<s.mis.length;q++){if(t>=s.mis[q][0]*(d/s.d[1]))mm=s.mis[q][1];}
      setMicroOnce(s.st,mm);
    }
    if(t>=d){
      if(cur<list.length-1)show(cur+1);
      else{ended=true;playing=false;setPlayLabel();if(CFG.next)nextEl.hidden=false;}
    }
    var el_=cum[cur]+Math.min(t,d);
    document.getElementById('prog').style.width=(el_/total*100)+'%';
    var rem=Math.max(0,Math.round(total-el_));document.getElementById('clock').textContent=Math.floor(rem/60)+':'+('0'+rem%60).slice(-2)+' left';
  }
  requestAnimationFrame(tick);
}
var lastMi='';
function setMicroOnce(st,mi){var k=st+':'+mi;if(k!==lastMi){lastMi=k;setMaps(st,mi);}}
function setPlayLabel(){var b=document.getElementById('play');b.textContent=ended?'Replay':playing?'Pause':'Play';b.setAttribute('aria-label',b.textContent);}
document.getElementById('play').onclick=function(){if(ended){show(0);playing=true;}else playing=!playing;setPlayLabel();};
document.getElementById('prev').onclick=function(){show(cur-1);};
document.getElementById('next').onclick=function(){show(cur+1);};
function setLevel(l){level=l;try{history.replaceState(null,'',l===2?'#l2':'#l1');}catch(e){}build();playing=true;show(0);setPlayLabel();}
document.getElementById('lv1').onclick=function(){setLevel(1);};
document.getElementById('lv2').onclick=function(){setLevel(2);};
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'){show(cur+1);}else if(e.key==='ArrowLeft'){show(cur-1);}
  else if(e.key===' '){e.preventDefault();document.getElementById('play').click();}
});
window.addEventListener('resize',function(){if(cur>=0&&nodes[cur])fit(nodes[cur],list[cur]);});
build();show(0);setPlayLabel();requestAnimationFrame(function(n){last=n;requestAnimationFrame(tick);});
window.__f1={show:function(i){show(i);},get n(){return list.length;},get total(){return total;},setLevel:setLevel,seek:function(x){t=x;},get list(){return list;},get scale(){return level===2?(CFG.l2scale||1):1;}};

})();
</script>
